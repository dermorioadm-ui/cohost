# O portão de todo PR: tipos, build e os testes das funções por onde passa
# dinheiro e documento. Sem isto, "o build quebrou" é descoberto no deploy —
# ou seja, pelo cliente.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run
      - run: npm ci --prefix backend
      - run: npm run test:database --prefix backend
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: legal-ui-failure
          path: test-results/
          retention-days: 7
